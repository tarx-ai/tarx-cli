name: CLI checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: sh -n tarx
      - name: Run ShellCheck
        run: shellcheck -S warning tarx
      - name: Exercise read-only commands
        run: |
          ./tarx version
          ./tarx help
      - name: Test client-specific MCP configuration
        run: sh tests/test-mcp-config.sh
      - name: Test inference route preflight
        run: sh tests/test-route-preflight.sh
      - name: Test conversational auth never invokes inference
        run: |
          python3 tests/test-chat-auth.py
          python3 tests/test-approval-url-guardrails.py
      - name: Test conversation and private/compute entrypoints
        run: |
          python3 tests/test-conversation.py
          python3 tests/test-chat-destination.py
      - name: Test doctor states
        run: sh tests/test-doctor.sh

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install pinned runtime dependencies without scripts
        working-directory: runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict runtime contract typecheck
        working-directory: runtime
        run: ./node_modules/.bin/tsc --noEmit
      - name: Test runtime identity and HTTP commands
        working-directory: runtime
        run: node --test --experimental-strip-types *.test.ts
      - name: Test staged runtime package activation and failures
        run: python3 tests/test-runtime-package.py
      - name: Test public CLI install and readiness
        run: sh tests/test-install-readiness.sh
